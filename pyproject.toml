[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memgym"
version = "0.2.0"
description = "A modular framework for testing memory abilities of AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "MemGym Team" },
]
keywords = ["memory", "agents", "llm", "benchmark", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies (from requirements.txt)
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "tiktoken>=0.5.0",
    "pydantic>=2.0.0",
    "litellm>=1.65.0",
    "tqdm>=4.65.0",
]

[project.urls]
Documentation = "https://github.com/WujiangXu/MemGym"
Source = "https://github.com/WujiangXu/MemGym"
Tracker = "https://github.com/WujiangXu/MemGym/issues"

[project.scripts]
memgym-evaluate = "memgym.gym.swe_bench.evaluate:main"
memgym-eval-rm = "memgym.training.eval.rm_cli:main"
memgym-eval-memory = "memgym.training.eval.memory_eval_cli:main"

[project.optional-dependencies]
tau2 = [
    "fs",
    "rich",
    "plotly>=6.0.0",
    "scikit-learn>=1.6.1",
    "tabulate>=0.9.0",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
    "pydantic-argparse>=0.10.0",
    "pandas>=2.2.3",
    "psutil>=7.0.0",
    "loguru>=0.7.3",
    "docstring-parser>=0.16",
    "litellm>=1.65.0",
    "tenacity>=9.0.0",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
    "redis>=5.2.1",
    "deepdiff>=8.4.2",
    "addict>=2.4.0",
    "PyYAML>=6.0.2",
    "toml>=0.10.2",
    "langfuse>=2.60.7",
    "gymnasium>=1.2.2",
]

swe = [
    "beautifulsoup4",
    "chardet",
    "datasets",
    "docker",
    "ghapi",
    "GitPython",
    "python-dotenv",
    "requests",
    "rich",
    "tenacity",
    "tqdm",
    "unidiff",
    "openai",
    "anthropic",
    "tiktoken",
    "transformers",
    "jedi",
    "litellm>=1.65.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# Training stack — versions floor at torch 2.4+, transformers 4.44+,
# trl 0.10+, peft 0.12+, accelerate 0.34+.
train = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "trl>=0.10.0",
    "peft>=0.12.0",
    "accelerate>=0.34.0",
    "datasets",
    "bitsandbytes",
    "sentencepiece",
    "huggingface-hub>=0.25.0",
    "wandb>=0.16.0",
]

# Agentic-RL via VeRL (pinned at v0.7.1). Install in an isolated venv —
# numpy<2 (VeRL) conflicts with numpy>=2 elsewhere.
rl-way-a = [
    "verl==0.7.1",
    "vllm>=0.7.0",
    "ray[default]>=2.10.0",
    "pyarrow>=15.0.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
]

# Lightweight extras for memgym-eval-rm (reward-model scoring only).
eval = [
    "huggingface-hub>=0.25.0",
    "datasets",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "bitsandbytes",
    "accelerate>=0.34.0",
    "torch>=2.4.0",
]

# LightMem (zjunlp/LightMem) for the IR track's `ir_lightmem` strategy.
# Upstream pins python>=3.10,<3.12, so it will NOT resolve on Python 3.12+;
# install it in a compatible venv. The IR adapter talks to LightMem over a
# subprocess bridge — point $LIGHTMEM_VENV at that env (see memory/ir/ir_lightmem.py).
lightmem = [
    "lightmem",
]

# A-mem (Agentic Memory) extras — needed for HippoRAG, SimpleMem, Mem0
# memory backends and the IR pipeline.
amem = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.0.0",
    "rank-bm25>=0.2.0",
    "nltk>=3.8.0",
    "hipporag>=2.0.0",
    "simplemem",
    "mem0ai>=0.1.0",
    "numpy>=1.24",
]

# WebArena (Web GUI) track.
webarena = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
    "litellm>=1.40",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ship bundled YAML config files that live inside the package tree.
[tool.setuptools.package-data]
"memgym.pipelines.configs" = ["*.yaml"]
"memgym.pipelines.memgym_ir.configs" = ["*.yaml"]
"memgym.training.configs" = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
